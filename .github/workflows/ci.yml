name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend
      - name: Test
        run: cd backend && pytest --cov=app --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck + generated-types check
        run: npm run build --prefix frontend
      - name: Unit tests
        run: npm test --prefix frontend
      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Component/browser tests
        run: npm run test:e2e --prefix frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t traceback-backend:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t traceback-frontend:ci .

  integration:
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Run full integration harness
        run: bash scripts/run-integration.sh
